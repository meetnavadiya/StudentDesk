

{% block content %}
<style>
  /* styles.css */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background-color: #fff;
  padding: 20px 30px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 400px;
}

.login-form h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

.form-group {
  margin-bottom: 15px;
}

.form-group input[type="text"],
.form-group input[type="password"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 16px;
}

.btn {
  width: 100%;
  padding: 12px;
  background-color: #007bff;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
}

.btn:hover {
  background-color: #0056b3;
}

.signup-link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  color: #666;
}

.signup-link a {
  color: #007bff;
  text-decoration: none;
}

.signup-link a:hover {
  text-decoration: underline;
}
</style>

</head>
<body>
  <div class="container">
    <form class="login-form" method="POST">
      {% csrf_token %}
      <h2>Login</h2>
      <div class="form-group">
        <input type="text" name="un" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <input type="password" name="pw" placeholder="Enter your password" required>
      </div>

      <p style="color: red;">{{ msg }}</p>
      <button type="submit" class="btn">Login Now</button>
      
      <p class="signup-link">Don't have an account? <a href="{% url 'singup' %}">Register now</a></p>
    </form>
  </div>
</body>
</html>


{% endblock content %}
