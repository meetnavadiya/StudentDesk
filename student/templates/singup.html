{% block content %}
<style>
    /* styles.css */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background-color: #fff;
  padding: 20px 30px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 400px;
}

.registration-form h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

.form-group {
  margin-bottom: 15px;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="password"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 16px;
}

.form-group label {
  font-size: 14px;
  color: #666;
}

.form-group input[type="checkbox"] {
  margin-right: 5px;
}

.btn {
  width: 100%;
  padding: 12px;
  background-color: #007bff;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
}

.btn:hover {
  background-color: #0056b3;
}

.login-link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  color: #666;
}

.login-link a {
  color: #007bff;
  text-decoration: none;
}

.login-link a:hover {
  text-decoration: underline;
}

</style>
  <div class="container">
    <form class="registration-form" method="POST">
      {% csrf_token %}
      <h2>Registration</h2>
      <div class="form-group">
        <input type="text" name="un" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <input type="password" name="pw1" placeholder="Create password" required>
      </div>
      <div class="form-group">
        <input type="password" name="pw2" placeholder="Confirm password" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" required>
          I accept all terms & conditions
        </label>
      </div>
      <p style="color: red;">{{ msg }}</p>
      <button type="submit" class="btn">Register Now</button>
      <p class="login-link">Already have an account? <a href="{% url 'login' %}">Login now</a></p>
    </form>
  </div>
</body>
</html>



{% endblock content %}
